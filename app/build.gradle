plugins {
    id 'com.android.application'
}

android {
    namespace 'se.hemma.hemskarm'
    compileSdk 35

    defaultConfig {
        applicationId 'se.hemma.hemskarm'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}
